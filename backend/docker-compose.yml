# Betrieb auf einem eigenen Server (oder lokal zum Ausprobieren).
#
#   cp .env.example .env   # ausfüllen, insbesondere JWT_SECRET und CREDENTIALS_KEY
#   docker compose up -d --build
#
# Bei einer verwalteten Datenbank (Supabase o. ä.) den Dienst "db" streichen und
# DATABASE_URL in der .env auf die externe Datenbank zeigen lassen.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      RUN_WORKER_IN_PROCESS: "true"
    ports:
      - "8000:8000"
    volumes:
      - medien:/app/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: winterfeld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: winterfeld
    volumes:
      - datenbank:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winterfeld -d winterfeld"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  datenbank:
  medien:
