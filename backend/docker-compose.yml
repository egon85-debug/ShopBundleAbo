# Betrieb des Backends als Container.
#
# Mit einer verwalteten Datenbank (Supabase o. ae.) — der Normalfall:
#   cp .env.example .env    # ausfuellen, vor allem DATABASE_URL, JWT_SECRET, CREDENTIALS_KEY
#   docker compose up -d --build
#
# Mit eigener PostgreSQL im Container (zum Ausprobieren ohne Konto):
#   docker compose --profile lokale-db up -d --build
#   DATABASE_URL zeigt dann auf den Dienst "db" (siehe .env.example).
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      RUN_WORKER_IN_PROCESS: "true"
    ports:
      - "8000:8000"
    volumes:
      # Fotos und Sprachaufnahmen bei STORAGE_BACKEND=local.
      - medien:/app/storage

  # Nur mit --profile lokale-db. Der API-Container wartet beim Start von sich
  # aus auf die Datenbank, ein depends_on ist deshalb nicht noetig — und wuerde
  # den Betrieb ohne diesen Dienst verhindern.
  db:
    profiles: ["lokale-db"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: winterfeld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in der .env gesetzt sein}
      POSTGRES_DB: winterfeld
    ports:
      - "5432:5432"
    volumes:
      - datenbank:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winterfeld -d winterfeld"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  datenbank:
  medien:
