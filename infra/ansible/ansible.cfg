[defaults]
inventory = inventar/staging.yml
roles_path = roles
collections_path = ./collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
# Kennwörter und Schlüssel nie im Protokoll zeigen (siehe no_log in den Rollen).
display_args_to_stdout = False

[ssh_connection]
pipelining = True
