name: Backend-Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Echte PostgreSQL für Migrationen und Row Level Security. Nur für die
      # Tests; das Kennwort ist kein Geheimnis, der Dienst lebt nur im Lauf.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WF_TEST_POSTGRES: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Tests (inkl. Mandantentrennung gegen PostgreSQL)
        run: python -m pytest -q
      - name: Migration gegen leere Datenbank prüfen
        run: |
          DATABASE_URL="postgresql+psycopg2://postgres:postgres@localhost:5432/postgres" \
            python -m alembic upgrade head
