name: Shop-Tests

on:
  push:
    branches: ["**"]
    paths: ["shop/**", ".github/workflows/shop-tests.yml"]
  pull_request:
    paths: ["shop/**", ".github/workflows/shop-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shop/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: Produktions-Build
        run: npm run build
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          SESSION_SECRET: ci-build-secret-not-used-at-runtime
          # Keine Datenbank in der CI – die Schema-Ergänzung vor dem Build auslassen.
          SCHEMA_ERGAENZEN: aus
