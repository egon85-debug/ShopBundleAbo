name: Android-App

# Baut bei jeder Aenderung an der App ein installierbares APK. Es liegt danach
# unter Actions → dieser Lauf → Artifacts zum Herunterladen bereit.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # Die Versionsnummer ist die Zahl der Commits — ein flacher Klon
          # haette nur einen und wuerde jedes Update zum Downgrade machen.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Ausdruecklich angeben: die Vorgabe enthaelt das alte Paket
          # "tools", das es in aktuellen SDK-Werkzeugen nicht mehr gibt.
          packages: "platforms;android-35 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit-Tests und APK bauen
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Versionsnummer ermitteln
        id: version
        run: echo "name=$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: winterfeld-lager-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
